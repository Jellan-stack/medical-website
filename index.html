<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Appointment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#10b981',
                        accent: '#f59e0b',
                        light: '#f1f5f9',
                        dark: '#1e293b',
                        danger: '#ef4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            }
            .sidebar-link {
                @apply flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-primary/10 hover:text-primary;
            }
            .sidebar-link.active {
                @apply bg-primary/10 text-primary font-medium;
            }
            .form-input {
                @apply w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary;
            }
            .btn {
                @apply px-4 py-2 rounded-lg font-medium transition-all duration-200;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/90;
            }
            .btn-secondary {
                @apply bg-secondary text-white hover:bg-secondary/90;
            }
            .btn-danger {
                @apply bg-danger text-white hover:bg-danger/90;
            }
            .btn-outline {
                @apply border border-primary text-primary hover:bg-primary/5;
            }
            .tab-btn {
                @apply px-4 py-2 border-b-2 border-transparent transition-all hover:bg-gray-50;
            }
            .tab-btn.active {
                @apply border-primary text-primary font-medium;
            }
            .slot-btn {
                @apply px-3 py-2 border rounded-lg text-center transition-all;
            }
            .slot-btn.available {
                @apply border-secondary text-secondary hover:bg-secondary/10 cursor-pointer;
            }
            .slot-btn.unavailable {
                @apply border-gray-300 text-gray-400 cursor-not-allowed;
            }
            .slot-btn.selected {
                @apply bg-primary text-white border-primary;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-dark font-sans min-h-screen">
    <div id="app" class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 p-4 sticky top-0 h-screen">
            <div class="mb-8 mt-2">
                <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                    <i class="fa fa-heartbeat"></i>
                    <span>Clinic App</span>
                </h1>
                <p class="text-sm text-gray-500 mt-1">Appointment System</p>
            </div>
            
            <nav id="sidebar-nav" class="flex-1 space-y-1">
                <!-- Navigation links will be inserted dynamically -->
            </nav>
            
            <div id="user-area" class="mt-auto pt-4 border-t border-gray-200">
                <div id="user-info" class="hidden mb-3">
                    <p class="font-medium text-sm" id="user-name"></p>
                    <p class="text-xs text-gray-500" id="user-role"></p>
                </div>
                <button id="logout-btn" class="sidebar-link text-gray-600 hidden">
                    <i class="fa fa-sign-out"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>
        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-6">
            <!-- Mobile Header -->
            <div class="md:hidden flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                    <i class="fa fa-heartbeat"></i>
                    <span>Clinic Appointment</span>
                </h1>
                <button id="mobile-menu-btn" class="text-dark p-2">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
            <!-- Page Content -->
            <div id="page-content" class="max-w-5xl mx-auto">
                <!-- Content loads here dynamically -->
            </div>
        </main>
    </div>
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-white rounded-lg card-shadow p-4 max-w-sm transform translate-y-100 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div class="flex items-start gap-3">
            <i id="toast-icon" class="fa fa-check-circle text-xl text-secondary"></i>
            <div>
                <h4 id="toast-title" class="font-medium">Success</h4>
                <p id="toast-message" class="text-sm text-gray-600 mt-1"></p>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // 🔧 KAILANGAN I-SETUP ANG FIREBASE — ILAGAY ANG INYONG DATA DITO
        // =====================================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyC5u4Rz5K6Zb8xP9aD7eF3g2h1j0k9l8m7n6b5v4c3x2z1a0",
            authDomain: "your-clinic-app.firebaseapp.com",
            projectId: "your-clinic-app",
            storageBucket: "your-clinic-app.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abc123def456ghi789jkl0"
        };

        // =====================================================
        // CONFIGURATION
        // =====================================================
        const BUSINESS_HOURS = ["09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00"];
        const DAYS_AHEAD = 7;
        const SAMPLE_DOCTORS = [
            { id: 1, name: "Dr. Ana Reyes", specialty: "General Medicine", email: "doctor@clinic.com", password: "doctor123" },
            { id: 2, name: "Dr. Juan Dela Cruz", specialty: "Dentistry", email: "dentist@clinic.com", password: "dentist123" }
        ];

        // =====================================================
        // 🔥 INITIALIZE FIREBASE
        // =====================================================
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // =====================================================
        // TOAST HELPER
        // =====================================================
        function showToast(message, title = 'Notice', icon = 'fa-info-circle') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-icon').className = `fa ${icon} text-xl`;
            
            toast.classList.remove('translate-y-100', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.add('translate-y-100', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 4000);
        }

        // Format date nicely
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        }

        // =====================================================
        // GLOBAL STATE
        // =====================================================
        let currentUser = null; // { type: 'patient'|'doctor', id, name, email, doctorId? }
        let selectedDoctorId = null;
        let selectedSlotId = null;
        let timeSlots = [];

        // =====================================================
        // DATABASE & AUTH FUNCTIONS
        // =====================================================
        function hashPassword(password) {
            return CryptoJS.SHA256(password).toString();
        }

        // Initialize default doctors
        async function initDoctors() {
            const snapshot = await db.collection('doctors').get();
            if (snapshot.empty) {
                const batch = db.batch();
                SAMPLE_DOCTORS.forEach(d => {
                    batch.set(db.collection('doctors').doc(String(d.id)), {
                        name: d.name,
                        specialty: d.specialty,
                        email: d.email,
                        passwordHash: hashPassword(d.password)
                    });
                });
                await batch.commit();
                console.log('Default doctors created');
            }
        }

        // Generate time slots
        function generateSlotsForDoctor(doctorId) {
            const slots = [];
            const today = new Date();
            let slotId = Date.now();
            
            for (let offset = 0; offset < DAYS_AHEAD; offset++) {
                const day = new Date(today);
                day.setDate(today.getDate() + offset);
                if (day.getDay() === 0 || day.getDay() === 6) continue; // Skip weekends
                
                const dateStr = day.toISOString().split('T')[0];
                BUSINESS_HOURS.forEach(time => {
                    slots.push({
                        id: slotId++,
                        doctorId: doctorId,
                        date: dateStr,
                        time: time,
                        isBooked: false
                    });
                });
            }
            return slots;
        }

        // Load all slots
        async function loadAllSlots() {
            const snapshot = await db.collection('timeSlots').get();
            timeSlots = [];
            snapshot.forEach(doc => {
                timeSlots.push(doc.data());
            });
            return timeSlots;
        }

        // Ensure slots exist for doctor
        async function ensureSlotsForDoctor(doctorId) {
            const slots = timeSlots.filter(s => s.doctorId === doctorId);
            if (slots.length === 0) {
                const newSlots = generateSlotsForDoctor(doctorId);
                const batch = db.batch();
                newSlots.forEach(s => {
                    batch.set(db.collection('timeSlots').doc(String(s.id)), s);
                });
                await batch.commit();
                timeSlots.push(...newSlots);
            }
        }

        // Register Patient
        async function registerPatient(fullName, email, password) {
            const emailLower = email.toLowerCase();
            const snapshot = await db.collection('patients').where('email', '==', emailLower).get();
            if (!snapshot.empty) throw new Error('Email already exists');
            
            const userCred = await auth.createUserWithEmailAndPassword(emailLower, password);
            await db.collection('patients').doc(userCred.user.uid).set({
                fullName,
                email: emailLower,
                createdAt: new Date().toISOString()
            });
            return { uid: userCred.user.uid, fullName, email: emailLower };
        }

        // Login Patient
        async function loginPatient(email, password) {
            const emailLower = email.toLowerCase();
            try {
                const userCred = await auth.signInWithEmailAndPassword(emailLower, password);
                const doc = await db.collection('patients').doc(userCred.user.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    return { type: 'patient', id: userCred.user.uid, name: data.fullName, email: data.email };
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        // Login Doctor
        async function loginDoctor(email, password) {
            const passHash = hashPassword(password);
            const snapshot = await db.collection('doctors').where('email', '==', email.toLowerCase()).get();
            if (snapshot.empty) return null;
            
            let doctorData = null;
            snapshot.forEach(doc => {
                const d = doc.data();
                if (d.passwordHash === passHash) {
                    doctorData = { id: doc.id, ...d };
                }
            });
            
            if (doctorData) {
                return { 
                    type: 'doctor', 
                    id: doctorData.id, 
                    name: doctorData.name, 
                    email: doctorData.email,
                    specialty: doctorData.specialty,
                    doctorId: doctorData.id
                };
            }
            return null;
        }

        // Get all doctors
        async function getDoctors() {
            const snapshot = await db.collection('doctors').get();
            return snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        // Get available slots
        async function getAvailableSlots(doctorId) {
            await loadAllSlots();
            return timeSlots.filter(s => String(s.doctorId) === String(doctorId) && !s.isBooked);
        }

        // Book appointment
        async function bookAppointment(patientId, doctorId, slotId) {
            const slotRef = db.collection('timeSlots').doc(String(slotId));
            const slotDoc = await slotRef.get();
            if (!slotDoc.exists || slotDoc.data().isBooked) return null;

            await slotRef.update({ isBooked: true });
            await loadAllSlots();

            const now = new Date();
            const confirmationCode = `APT${now.getFullYear().toString().slice(-2)}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
            
            const appointmentData = {
                patientId,
                doctorId,
                slotId,
                bookedAt: now.toISOString(),
                confirmationCode,
                date: slotDoc.data().date,
                time: slotDoc.data().time
            };
            
            await db.collection('appointments').add(appointmentData);
            return confirmationCode;
        }

        // Cancel appointment
        async function cancelAppointment(confirmationCode) {
            const snapshot = await db.collection('appointments').where('confirmationCode', '==', confirmationCode).get();
            if (snapshot.empty) return false;
            
            let apptDoc = snapshot.docs[0];
            let appt = apptDoc.data();
            
            await db.collection('timeSlots').doc(String(appt.slotId)).update({ isBooked: false });
            await apptDoc.ref.delete();
            await loadAllSlots();
            return true;
        }

        // Get patient appointments
        async function getPatientAppointments(patientId) {
            const snapshot = await db.collection('appointments').where('patientId', '==', patientId).get();
            const doctors = await getDoctors();
            
            const appointments = [];
            snapshot.forEach(doc => {
                const a = doc.data();
                const doctor = doctors.find(d => String(d.id) === String(a.doctorId));
                appointments.push({
                    code: a.confirmationCode,
                    doctorName: doctor ? doctor.name : 'Unknown',
                    specialty: doctor ? doctor.specialty : '',
                    date: a.date,
                    time: a.time
                });
            });
            
            return appointments.sort((x, y) => x.date.localeCompare(y.date) || x.time.localeCompare(y.time));
        }

        // 🔑 GET DOCTOR'S OWN APPOINTMENTS ONLY
        async function getDoctorAppointments(doctorId) {
            const snapshot = await db.collection('appointments').where('doctorId', '==', String(doctorId)).get();
            const appointments = [];
            
            for (const doc of snapshot.docs) {
                const a = doc.data();
                const patientDoc = await db.collection('patients').doc(a.patientId).get();
                const patient = patientDoc.exists ? patientDoc.data() : { fullName: 'Unknown', email: '' };
                
                appointments.push({
                    patientName: patient.fullName || 'Unknown',
                    patientEmail: patient.email || '',
                    date: a.date,
                    time: a.time,
                    code: a.confirmationCode
                });
            }
            
            return appointments.sort((x, y) => x.date.localeCompare(y.date) || x.time.localeCompare(y.time));
        }

        // =====================================================
        // RENDER NAVIGATION
        // =====================================================
        function renderNav() {
            const nav = document.getElementById('sidebar-nav');
            const userInfo = document.getElementById('user-info');
            const logoutBtn = document.getElementById('logout-btn');
            
            if (!currentUser) {
                nav.innerHTML = `
                    <a href="#login" class="sidebar-link active" data-page="login">
                        <i class="fa fa-sign-in"></i>
                        <span>Login / Register</span>
                    </a>
                `;
                userInfo.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            } else if (currentUser.type === 'patient') {
                nav.innerHTML = `
                    <a href="#book" class="sidebar-link active" data-page="book">
                        <i class="fa fa-calendar-plus-o"></i>
                        <span>Book Appointment</span>
                    </a>
                    <a href="#appointments" class="sidebar-link" data-page="appointments">
                        <i class="fa fa-list-alt"></i>
                        <span>My Appointments</span>
                    </a>
                `;
                userInfo.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                document.getElementById('user-name').textContent = currentUser.name;
                document.getElementById('user-role').textContent = 'Patient';
            } else if (currentUser.type === 'doctor') {
                nav.innerHTML = `
                    <a href="#schedule" class="sidebar-link active" data-page="schedule">
                        <i class="fa fa-calendar-check-o"></i>
                        <span>My Schedule</span>
                    </a>
                `;
                userInfo.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                document.getElementById('user-name').textContent = currentUser.name;
                document.getElementById('user-role').textContent = 'Doctor — ' + currentUser.specialty;
            }

            document.querySelectorAll('#sidebar-nav a').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    document.querySelectorAll('#sidebar-nav a').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    const page = link.getAttribute('data-page');
                    if (page === 'login') renderLoginPage();
                    else if (page === 'book') renderBookPage();
                    else if (page === 'appointments') renderAppointmentsPage();
                    else if (page === 'schedule') renderSchedulePage();
                });
            });
        }

        // =====================================================
        // LOGIN / REGISTER PAGE
        // =====================================================
        async function renderLoginPage() {
            currentUser = null;
            renderNav();
            const content = document.getElementById('page-content');
            const doctors = await getDoctors();
            
            content.innerHTML = `
                <div class="max-w-md mx-auto mt-8">
                    <div class="bg-white rounded-xl card-shadow p-6 md:p-8">
                        <h2 class="text-2xl font-bold text-center mb-6 text-primary">Welcome</h2>
                        
                        <!-- Tabs -->
                        <div class="flex border-b border-gray-200 mb-6">
                            <button class="tab-btn active" data-tab="patient-login">Patient Login</button>
                            <button class="tab-btn" data-tab="register">Create Account</button>
                            <button class="tab-btn" data-tab="doctor-login">Doctor Login</button>
                        </div>
                        
                        <!-- Patient Login -->
                        <div id="patient-login" class="tab-content">
                            <h3 class="text-lg font-medium mb-4">Patient Login</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input type="email" id="login-email" class="form-input" placeholder="Enter your email">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
                                </div>
                                <button id="login-btn" class="btn btn-primary w-full mt-2">Log In</button>
                            </div>
                        </div>
                        
                        <!-- Register -->
                        <div id="register" class="tab-content hidden">
                            <h3 class="text-lg font-medium mb-4">Create Patient Account</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                    <input type="text" id="reg-name" class="form-input" placeholder="Your full name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input type="email" id="reg-email" class="form-input" placeholder="Enter your email">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters">
                                </div>
                                <button id="register-btn" class="btn btn-secondary w-full mt-2">Create Account</button>
                            </div>
                        </div>
                        
                        <!-- Doctor Login -->
                        <div id="doctor-login" class="tab-content hidden">
                            <h3 class="text-lg font-medium mb-4">Doctor Login</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input type="email" id="doctor-email" class="form-input" placeholder="Your work email">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input type="password" id="doctor-password" class="form-input" placeholder="Enter password">
                                </div>
                                <div class="text-xs text-gray-500 bg-gray-50 p-2 rounded mb-2">
                                    <strong>Sample Accounts:</strong><br>
                                    Dr. Ana Reyes → doctor@clinic.com / doctor123<br>
                                    Dr. Juan Dela Cruz → dentist@clinic.com / dentist123
                                </div>
                                <button id="doctor-login-submit" class="btn btn-primary w-full mt-2">Log In as Doctor</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                    document.getElementById(btn.dataset.tab).classList.remove('hidden');
                });
            });

            // Patient Login
            document.getElementById('login-btn').addEventListener('click', async () => {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                
                if (!email || !password) {
                    showToast('Please fill in all fields.', 'Missing Information', 'fa-exclamation-circle');
                    return;
                }
                
                const patient = await loginPatient(email, password);
                if (patient) {
                    currentUser = patient;
                    showToast(`Welcome back, ${patient.name}!`, 'Login Successful', 'fa-check-circle');
                    renderBookPage();
                } else {
                    showToast('Invalid email or password.', 'Login Failed', 'fa-times-circle');
                }
            });

            // Register
            document.getElementById('register-btn').addEventListener('click', async () => {
                const name = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;
                
                if (!name || !email || !password) {
                    showToast('Please fill in all fields.', 'Missing Information', 'fa-exclamation-circle');
                    return;
                }
                if (!email.includes('@') || !email.includes('.')) {
                    showToast('Please enter a valid email address.', 'Invalid Email', 'fa-exclamation-circle');
                    return;
                }
                if (password.length < 6) {
                    showToast('Password must be at least 6 characters.', 'Weak Password', 'fa-exclamation-triangle');
                    return;
                }
                
                try {
                    await registerPatient(name, email, password);
                    showToast('Account created successfully! You may now log in.', 'Account Created', 'fa-check-circle');
                    document.querySelector('[data-tab="patient-login"]').click();
                } catch (e) {
                    showToast(e.message || 'Failed to create account.', 'Error', 'fa-exclamation-circle');
                }
            });

            // Doctor Login
            document.getElementById('doctor-login-submit').addEventListener('click', async () => {
                const email = document.getElementById('doctor-email').value.trim();
                const password = document.getElementById('doctor-password').value;
                
                if (!email || !password) {
                    showToast('Please enter email and password.', 'Missing Information', 'fa-exclamation-circle');
                    return;
                }
                
                const doctor = await loginDoctor(email, password);
                if (doctor) {
                    currentUser = doctor;
                    await ensureSlotsForDoctor(doctor.doctorId);
                    showToast(`Welcome, Dr. ${doctor.name.split(' ')[1]}!`, 'Access Granted', 'fa-user-md');
                    renderSchedulePage();
                } else {
                    showToast('Invalid doctor credentials.', 'Login Failed', 'fa-times-circle');
                }
            });
        }

        // =====================================================
        // BOOK APPOINTMENT PAGE
        // =====================================================
        async function renderBookPage() {
            if (!currentUser || currentUser.type !== 'patient') return renderLoginPage();
            renderNav();
            selectedDoctorId = null;
            selectedSlotId = null;
            
            const content = document.getElementById('page-content');
            const doctors = await getDoctors();
            const specialties = [...new Set(doctors.map(d => d.specialty))];
            
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white rounded-xl card-shadow p-6">
                        <h2 class="text-xl font-bold mb-6 text-primary">Book an Appointment</h2>
                        
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Specialty</label>
                            <select id="specialty-filter" class="form-input mb-4">
                                <option value="all">All Specialties</option>
                                ${specialties.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>
                        
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Select a Doctor</label>
                            <div id="doctor-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${doctors.map(d => `
                                    <div class="doctor-card border rounded-lg p-4 cursor-pointer hover:border-primary hover:bg-primary/5 transition-all" data-doctor-id="${d.id}" data-specialty="${d.specialty}">
                                        <h3 class="font-semibold text-lg">${d.name}</h3>
                                        <p class="text-sm text-gray-500">${d.specialty}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div id="slots-section" class="bg-white rounded-xl card-shadow p-6 hidden">
                        <h3 class="text-lg font-semibold mb-4">Available Time Slots</h3>
                        <p id="selected-doctor-name" class="text-gray-600 mb-4"></p>
                        <div id="slots-container" class="space-y-4"></div>
                        <button id="book-selected-btn" class="btn btn-secondary mt-6 hidden">Book Selected Slot</button>
                    </div>
                </div>
            `;

            document.getElementById('specialty-filter').addEventListener('change', e => {
                const val = e.target.value;
                document.querySelectorAll('.doctor-card').forEach(card => {
                    if (val === 'all' || card.dataset.specialty === val) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                });
            });

            document.querySelectorAll('.doctor-card').forEach(card => {
                card.addEventListener('click', async () => {
                    document.querySelectorAll('.doctor-card').forEach(c => {
                        c.classList.remove('border-primary', 'bg-primary/5');
                        c.classList.add('border-gray-200');
                    });
                    card.classList.remove('border-gray-200');
                    card.classList.add('border-primary', 'bg-primary/5');
                    
                    selectedDoctorId = card.dataset.doctorId;
                    selectedSlotId = null;
                    const doctors = await getDoctors();
                    const doctor = doctors.find(d => String(d.id) === String(selectedDoctorId));
                    
                    document.getElementById('slots-section').classList.remove('hidden');
                    document.getElementById('selected-doctor-name').textContent = `${doctor.name} — ${doctor.specialty}`;
                    await loadSlots();
                });
            });

            document.getElementById('book-selected-btn').addEventListener('click', async () => {
                if (!selectedSlotId) return;
                const code = await bookAppointment(currentUser.id, selectedDoctorId, selectedSlotId);
                if (code) {
                    showToast(`Appointment confirmed! Confirmation code: ${code}`, 'Booking Successful', 'fa-check-circle');
                    await loadSlots();
                    document.getElementById('book-selected-btn').classList.add('hidden');
                    selectedSlotId = null;
                } else {
                    showToast('Sorry, this slot has already been taken.', 'Booking Failed', 'fa-times-circle');
                }
            });
        }

        async function loadSlots() {
            const slots = await getAvailableSlots(selectedDoctorId);
            const container = document.getElementById('slots-container');
            selectedSlotId = null;
            document.getElementById('book-selected-btn').classList.add('hidden');
            
            if (!slots.length) {
                container.innerHTML = `<p class="text-gray-500 italic">No available slots for this doctor in the coming days.</p>`;
                return;
            }

            const grouped = {};
            slots.forEach(s => {
                if (!grouped[s.date]) grouped[s.date] = [];
                grouped[s.date].push(s);
            });

            container.innerHTML = Object.entries(grouped).map(([date, slots]) => `
                <div class="border-b pb-3">
                    <h4 class="font-medium text-gray-700 mb-2">${formatDate(date)}</h4>
                    <div class="flex flex-wrap gap-2">
                        ${slots.map(slot => `
                            <button class="slot-btn available" data-slot-id="${slot.id}" data-date="${date}" data-time="${slot.time}">
                                ${slot.time}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('.slot-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedSlotId = parseInt(btn.dataset.slotId);
                    document.getElementById('book-selected-btn').classList.remove('hidden');
                });
            });
        }

        // =====================================================
        // PATIENT'S APPOINTMENTS PAGE
        // =====================================================
        async function renderAppointmentsPage() {
            if (!currentUser || currentUser.type !== 'patient') return renderLoginPage();
            renderNav();
            
            const appointments = await getPatientAppointments(currentUser.id);
            const content = document.getElementById('page-content');
            
            content.innerHTML = `
                <div class="bg-white rounded-xl card-shadow p-6">
                    <h2 class="text-xl font-bold mb-6 text-primary">My Appointments</h2>
                    ${!appointments.length ? `
                        <div class="text-center py-10 text-gray-500">
                            <i class="fa fa-calendar-o text-4xl mb-4"></i>
                            <p>You have no upcoming appointments.</p>
                            <a href="#book" class="text-primary font-medium mt-2 inline-block" onclick="renderBookPage()">Book your first appointment</a>
                        </div>
                    ` : `
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b">
                                        <th class="text-left p-3 font-semibold text-sm">Confirmation #</th>
                                        <th class="text-left p-3 font-semibold text-sm">Doctor</th>
                                        <th class="text-left p-3 font-semibold text-sm">Date</th>
                                        <th class="text-left p-3 font-semibold text-sm">Time</th>
                                        <th class="text-left p-3 font-semibold text-sm">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${appointments.map(a => `
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="p-3 font-mono text-sm">${a.code}</td>
                                            <td class="p-3">
                                                <div class="font-medium">${a.doctorName}</div>
                                                <div class="text-xs text-gray-500">${a.specialty}</div>
                                            </td>
                                            <td class="p-3">${formatDate(a.date)}</td>
                                            <td class="p-3">${a.time}</td>
                                            <td class="p-3">
                                                <button class="btn btn-danger text-xs py-1 px-2 cancel-btn" data-code="${a.code}">Cancel</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;

            document.querySelectorAll('.cancel-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const code = btn.dataset.code;
                    if (confirm('Are you sure you want to cancel this appointment?')) {
                        await cancelAppointment(code);
                        showToast('Appointment cancelled successfully.', 'Cancelled', 'fa-info-circle');
                        renderAppointmentsPage();
                    }
                });
            });
        }

        // =====================================================
        // 🔑 DOCTOR'S SCHEDULE PAGE — SARILI LANG ANG NAKIKITA
        // =====================================================
        async function renderSchedulePage() {
            if (!currentUser || currentUser.type !== 'doctor') return renderLoginPage();
            renderNav();
            
            const appointments = await getDoctorAppointments(currentUser.doctorId);
            const content = document.getElementById('page-content');
            
            content.innerHTML = `
                <div class="bg-white rounded-xl card-shadow p-6">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-xl font-bold text-primary">${currentUser.name}</h2>
                            <p class="text-gray-500">${currentUser.specialty} — My Schedule Only</p>
                        </div>
                        <button id="refresh-btn" class="btn btn-outline text-sm">
                            <i class="fa fa-refresh mr-1"></i> Refresh
                        </button>
                    </div>
                    
                    ${!appointments.length ? `
                        <div class="text-center py-10 text-gray-500">
                            <i class="fa fa-calendar-check-o text-4xl mb-4"></i>
                            <p>You have no scheduled appointments yet.</p>
                            <p class="text-sm mt-2">Only your own appointments appear here.</p>
                        </div>
                    ` : `
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b">
                                        <th class="text-left p-3 font-semibold text-sm">Patient Name</th>
                                        <th class="text-left p-3 font-semibold text-sm">Email</th>
                                        <th class="text-left p-3 font-semibold text-sm">Date</th>
                                        <th class="text-left p-3 font-semibold text-sm">Time</th>
                                        <th class="text-left p-3 font-semibold text-sm">Reference #</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${appointments.map(a => `
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="p-3 font-medium">${a.patientName}</td>
                                            <td class="p-3 text-sm">${a.patientEmail}</td>
                                            <td class="p-3">${formatDate(a.date)}</td>
                                            <td class="p-3">${a.time}</td>
                                            <td class="p-3 font-mono text-xs">${a.code}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;

            document.getElementById('refresh-btn').addEventListener('click', renderSchedulePage);
        }

        // =====================================================
        // GLOBAL INITIALIZATION
        // =====================================================
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await auth.signOut();
            currentUser = null;
            showToast('You have been logged out.', 'Logged Out', 'fa-sign-out');
            renderLoginPage();
        });

        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('fixed');
            sidebar.classList.toggle('z-40');
            sidebar.classList.toggle('inset-y-0');
            sidebar.classList.toggle('left-0');
        });

        // Auth state persistence — stay logged in across devices
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('patients').doc(user.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    currentUser = { type: 'patient', id: user.uid, name: data.fullName, email: data.email };
                    renderBookPage();
                }
            } else {
                await initDoctors();
                renderLoginPage();
            }
        });
    </script>
</body>
</html>
